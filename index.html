<style>
/* Layout: una columna tipo app de celular; tarjetas por sección, cajas como etiquetas con número grande. */
:root{
  --bg:#f6f8fb; --surface:#ffffff; --ink:#16233a; --muted:#5d6b80; --line:#dde4ee;
  --accent:#1f63b3; --accent-ink:#ffffff; --accent-soft:#e6eefa; --box:#8a5a2b; --box-soft:#f5ebe0;
  --danger:#b3261e; --ok:#1d7a4a;
  --display:"Fraunces", Georgia, "Times New Roman", serif;
  --body:"Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1520; --surface:#18212f; --ink:#e8eef7; --muted:#9aa8bc; --line:#2a3647;
  --accent:#6ea8f0; --accent-ink:#0b1422; --accent-soft:#1d2d45; --box:#d9a46c; --box-soft:#2e241a;
  --danger:#ff8a80; --ok:#6fd39c; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0f1520; --surface:#18212f; --ink:#e8eef7; --muted:#9aa8bc; --line:#2a3647;
  --accent:#6ea8f0; --accent-ink:#0b1422; --accent-soft:#1d2d45; --box:#d9a46c; --box-soft:#2e241a;
  --danger:#ff8a80; --ok:#6fd39c; color-scheme:dark }
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0;padding-top:env(safe-area-inset-top,0px)}
.login{max-width:380px;margin:40px auto 0}
.err{color:var(--danger);font-size:14px;margin-top:8px}
@media print{.fab,.noprint,.back,.brand{display:none!important}body{background:#fff}.labels{display:grid;grid-template-columns:1fr 1fr;gap:6mm}.labels img{width:100%;break-inside:avoid}}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
.wrap{max-width:1600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 110px}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance}
h1{font-size:30px;letter-spacing:-.01em}
h1 em{color:var(--accent);font-style:italic}
h2{font-size:22px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.status{font-size:12px;color:var(--muted)}
.search{margin-top:14px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:0 16px}
.search input{border:0;background:transparent;flex:1;min-width:0;padding:13px 0;outline:none}
.tabs{display:flex;gap:6px;margin-top:14px;overflow-x:auto}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;white-space:nowrap}
.tab[aria-current="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.stats{display:flex;gap:18px;margin:16px 2px 4px;color:var(--muted);font-size:13px;flex-wrap:wrap}
.stats b{color:var(--ink);font-size:17px;font-variant-numeric:tabular-nums;margin-right:4px}
.brand{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:clamp(10px,3vw,36px) clamp(6px,2vw,20px);border-bottom:1px solid var(--line);margin-bottom:6px}
.brand h1{font-size:clamp(40px,9vw,104px);line-height:.95;letter-spacing:-.02em}
.banners{display:flex;flex-direction:column;gap:clamp(10px,1.6vw,18px);margin-top:16px}
.banner{position:relative;display:block;width:100%;min-height:clamp(150px,24vw,280px);border-radius:clamp(14px,2vw,24px);overflow:hidden;border:0;padding:0;text-align:left;color:#fff;background:var(--sc,#333);isolation:isolate}
.banner .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;transition:transform .5s ease}
.banner::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(8,12,20,.72) 0%,rgba(8,12,20,.35) 55%,rgba(8,12,20,.05) 100%)}
.banner.noimg{background:linear-gradient(120deg,var(--sc) 0%,color-mix(in srgb,var(--sc) 55%,#000) 100%)}
.banner.noimg::after{background:radial-gradient(circle at 85% 30%,rgba(255,255,255,.18),transparent 55%)}
.banner .in{position:absolute;left:clamp(18px,3vw,44px);bottom:clamp(16px,2.6vw,36px);right:120px}
.banner .nm{font-family:var(--display);font-weight:600;font-size:clamp(34px,6.4vw,84px);line-height:.95;letter-spacing:-.01em;text-shadow:0 2px 18px rgba(0,0,0,.35)}
.banner .ct{margin-top:8px;font-weight:700;font-size:clamp(13px,1.4vw,17px);opacity:.92}
.banner .ph-btn{cursor:pointer;position:absolute;top:clamp(10px,1.4vw,18px);right:clamp(10px,1.4vw,18px);background:rgba(255,255,255,.9);color:#16233a;border:0;border-radius:999px;padding:8px 13px;font-weight:800;font-size:13px;display:flex;align-items:center;gap:6px}
.banner .go{position:absolute;right:clamp(18px,3vw,44px);bottom:clamp(16px,2.6vw,36px);font-weight:800;font-size:clamp(13px,1.4vw,16px);background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.45);border-radius:999px;padding:8px 14px;backdrop-filter:blur(4px)}
@media (hover:hover) and (prefers-reduced-motion:no-preference){.banner:hover .bg{transform:scale(1.04)}}
.hero{min-height:clamp(140px,20vw,240px);cursor:default}
.group-title{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:800;margin:22px 2px 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.sec{display:flex;flex-direction:column;gap:2px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-height:74px}
.sec .n{font-weight:800;font-size:15px}
.sec .c{font-size:13px;color:var(--muted)}
.sec .c.zero{opacity:.7}
.sec .sw{width:22px;height:5px;border-radius:3px;margin-bottom:6px}
.list{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.item{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:left;width:100%}
.thumb{width:54px;height:54px;border-radius:10px;flex:none;background:var(--accent-soft);display:grid;place-items:center;font-family:var(--display);font-weight:600;color:var(--accent);font-size:20px;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.item .txt{min-width:0;flex:1}
.item .t{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border-radius:8px;padding:3px 8px;flex:none}
.pill.box{background:var(--box-soft);color:var(--box)}
.pill.loc{background:var(--accent-soft);color:var(--accent)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:10px}
.card{display:flex;flex-direction:column;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:0;overflow:hidden;position:relative;min-width:0}
.card .ph{aspect-ratio:1/1;width:100%;max-width:100%;display:grid;place-items:center;background:var(--accent-soft);position:relative;overflow:hidden}
.card .ph img{width:100%;height:100%;object-fit:cover;display:block}
.card .ph .ini{font-family:var(--display);font-size:46px;font-weight:600;line-height:1}
.card .ph .add{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-size:11px;font-weight:800;color:var(--muted)}
.card .badge{position:absolute;top:8px;left:8px;z-index:1}
.card .badge .boxtag{min-width:0;padding:4px 8px;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.card .badge .boxtag span{font-size:18px}
.card .badge .pill{box-shadow:0 2px 8px rgba(0,0,0,.12);background:var(--surface)}
.card .bd{padding:10px 12px 12px;min-width:0}
.card .t{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .s{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.boxcard{display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;text-align:left;width:100%}
.boxtag{flex:none;background:var(--box);color:var(--bg);border-radius:12px;padding:6px 10px;text-align:center;min-width:64px}
.boxtag small{display:block;font-size:10px;letter-spacing:.14em;font-weight:800}
.boxtag span{font-family:var(--display);font-size:24px;font-weight:600;line-height:1}
.back{border:0;background:none;color:var(--accent);font-weight:800;padding:6px 0;margin-bottom:6px}
.head{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.head .meta{flex:1;min-width:200px}
.head p{margin:4px 0 0;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;font-weight:800}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger)}
.btn.danger.armed{background:var(--danger);color:var(--surface);border-color:var(--danger)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.qrbox{background:#fff;border-radius:12px;padding:10px;width:140px;flex:none;border:1px solid var(--line)}
.qrbox canvas{width:100%;height:auto;display:block}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;color:var(--muted);margin-top:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:700}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.fab{position:fixed;right:max(18px,calc(env(safe-area-inset-right,0px) + 18px));bottom:calc(env(safe-area-inset-bottom,0px) + 18px);background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:15px 20px;font-weight:800;font-size:16px;box-shadow:0 8px 24px rgba(16,35,70,.25);z-index:5}
.sheet-bg{position:fixed;inset:0;background:rgba(10,18,30,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:620px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:18px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px))}
.sheet h2{margin-bottom:12px}
.f{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.f label{font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.04em}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px;width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.photo-prev{width:90px;height:90px;border-radius:12px;object-fit:cover;border:1px solid var(--line)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 86px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;z-index:30;max-width:90%}
.note{font-size:13px;color:var(--muted);margin-top:8px}
.example{font-size:10px;font-weight:800;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 5px;margin-left:6px;vertical-align:2px}
@media (max-width:420px){h1{font-size:26px}.two{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}

/* Tarjetas grandes con texto sobre la foto, sin marco */
.cards{grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:14px}
.card{border:0!important;background:none!important;border-radius:var(--r);cursor:pointer;box-shadow:none}
.card .ph{aspect-ratio:3/4;border-radius:var(--r);background:linear-gradient(150deg,var(--sc,#3f7cc4),color-mix(in srgb,var(--sc,#3f7cc4) 50%,#000))}
.card .ph .ini{color:rgba(255,255,255,.85)!important;font-size:84px}
.card .ph .add{top:14px;bottom:auto;color:rgba(255,255,255,.85)}
.card .bd{position:absolute;left:0;right:0;bottom:0;padding:48px 16px 16px;color:#fff;background:linear-gradient(to top,rgba(5,10,20,.82) 0%,rgba(5,10,20,.45) 55%,rgba(5,10,20,0) 100%);border-radius:0 0 var(--r) var(--r);pointer-events:none}
.card .t{font-family:var(--display);font-size:22px;font-weight:600;white-space:normal;text-shadow:0 1px 8px rgba(0,0,0,.4)}
.card .s{color:rgba(255,255,255,.88);font-size:14px;margin-top:2px}
.card .nt{color:rgba(255,255,255,.75);font-size:13px;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .del{position:absolute;top:10px;right:10px;z-index:2;width:38px;height:38px;border-radius:999px;border:0;background:rgba(255,255,255,.92);color:var(--danger);display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.card .badge{top:10px;left:10px}
.card:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.confirm h2{margin-bottom:6px}
.confirm .big{font-size:15px;color:var(--muted);margin:0 0 14px}
.btn.solid-danger{background:var(--danger);border-color:var(--danger);color:#fff}
@media (max-width:700px){
  .cards{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .card .ph{border-radius:10px}
  .card .ph .ini{font-size:34px}
  .card .ph .add{display:none}
  .card .bd{padding:26px 7px 7px;border-radius:0 0 10px 10px}
  .card .t{font-size:13px;line-height:1.15;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card .s{font-size:11px;-webkit-line-clamp:1}
  .card .nt{display:none}
  .card .del{width:26px;height:26px;top:5px;right:5px}
  .card .del svg{width:13px;height:13px}
  .card .badge{top:5px;left:5px}
  .card .badge .boxtag{padding:2px 5px}
  .card .badge .boxtag small{font-size:7px}
  .card .badge .boxtag span{font-size:13px}
  .card .badge .pill{font-size:8px;padding:2px 5px}
}
.filtros{margin-top:14px;display:flex;flex-direction:column;gap:10px}
.filtros .chips{margin-top:0}
.frow{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.fsel{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1 1 130px;max-width:220px}
.fsel span{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.fsel select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 10px;width:100%}
@media (max-width:700px){.fsel{flex:1 1 calc(50% - 5px);max-width:none}.filtros .chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px}.chip{white-space:nowrap}}
.secbar{margin-top:14px;display:flex;flex-direction:column;gap:6px}
.secbar-l{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.secchips{margin-top:0}
.chip .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:0}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:800;padding:0;text-decoration:underline}
@media (max-width:700px){.secchips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}}
.vw{position:fixed;inset:0;z-index:25;background:rgba(6,10,18,.94);display:flex;flex-direction:column;color:#fff;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.vw-img{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:52px max(12px,env(safe-area-inset-left,0px)) 8px}
.vw-img img{max-width:100%;max-height:100%;object-fit:contain;border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.vw-noimg{width:min(80vw,420px);aspect-ratio:3/4;max-height:100%;border-radius:14px;background:linear-gradient(150deg,var(--sc),color-mix(in srgb,var(--sc) 50%,#000));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.vw-noimg span{font-family:var(--display);font-size:110px;line-height:1;opacity:.9}

.vw-t{font-family:var(--display);font-size:clamp(22px,4vw,32px);font-weight:600}
.vw-det{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:6px;font-size:14px;color:rgba(255,255,255,.85)}

.vw-nav{position:absolute;top:42%;width:44px;height:44px;border-radius:999px;border:0;background:rgba(255,255,255,.15);color:#fff;font-size:30px;line-height:1;z-index:2}

<body>

<div class="wrap" id="app">
  <header class="brand"><h1>Guille’s <em>Closet</em></h1><span class="status" id="status">Cargando tu ropa…</span></header>
  <div class="empty" style="margin-top:20px">Aquí aparecerán tus secciones (gimnasio, calor, invierno…) y tus cajas con su QR. Toca <b>+ Agregar</b> para registrar la primera prenda.</div>
</div>
<button class="fab" id="fab" type="button">+ Agregar</button>
<div id="layer"></div>

<script>
// ====== Configuración ======
const APP_URL = location.origin + location.pathname; // los QR apuntan aquí + #caja-c01

const SECCIONES = [
  ["", [
    ["verano","Verano","#e0892b"],
    ["invierno","Invierno","#3f7cc4"],
    ["abrigos","Abrigos","#5b5f8f"],
    ["chamarras","Chamarras","#7a4b2c"],
    ["formal","Formal","#2c3e66"],
    ["casual","Casual","#2f8a6a"],
    ["pantalones","Pantalones","#4b5d7a"],
    ["faldas","Faldas","#a8507a"],
    ["jumpsuit","Jumpsuit","#6a5a8c"],
    ["fiesta","Vestidos de fiesta","#c0407a"],
    ["pijamas","Pijamas","#7d6bc4"],
    ["gimnasio","Gimnasio","#d4502e"],
    ["playa","Trajes de baño","#1aa3a3"],
    ["interior","Ropa interior","#b0577a"],
    ["calcetines","Calcetines","#58799b"],
    ["bolsas","Bolsas","#9a6b3f"],
  ]],
];
const SEC = {}; SECCIONES.forEach(([g,l])=>l.forEach(([id,n,c])=>SEC[id]={id,n,c,g}));
const UBICACIONES = [["closet","Closet (colgado)"],["cajon","Cajón"],["caja","En una caja"],["lavanderia","Lavandería / sucia"],["prestada","Prestada"]];
const UBI = Object.fromEntries(UBICACIONES);

// ====== Estado ======
let sb=null, assets=true;
const urlCache=new Map();
const store={
  async reload(){
    const [p,c]=await Promise.all([sb.from("prendas").select("*"),sb.from("cajas").select("*")]);
    if(p.error||c.error) throw (p.error||c.error);
    S.prendas=new Map(p.data.map(r=>[r.id,clean(r)]));
    S.cajas=new Map(c.data.map(r=>[r.codigo.toLowerCase(),Object.assign(clean(r),{id:r.codigo.toLowerCase()})]));
    const need=p.data.map(r=>r.foto).filter(f=>f&&!urlCache.has(f));
    if(need.length){ const {data}=await sb.storage.from("fotos").createSignedUrls(need,60*60*24*7); (data||[]).forEach(d=>{if(d.signedUrl)urlCache.set(d.path,d.signedUrl)}) }
    try{ const {data:fl}=await sb.storage.from("fotos").list("fondos",{limit:200,sortBy:{column:"name",order:"desc"}});
      const latest={}; (fl||[]).forEach(f=>{const id=f.name.split("-")[0]; if(!latest[id]) latest[id]="fondos/"+f.name});
      const paths=Object.values(latest).filter(p=>!urlCache.has(p));
      if(paths.length){ const {data}=await sb.storage.from("fotos").createSignedUrls(paths,60*60*24*7); (data||[]).forEach(d=>{if(d.signedUrl)urlCache.set(d.path,d.signedUrl)}) }
      S.fondos=latest; S.fondosAll=(fl||[]).map(f=>"fondos/"+f.name);
    }catch(e){ S.fondos=S.fondos||{} }
    S.loaded.p=S.loaded.c=true;
    if(!$("#layer").innerHTML) render(); else pending=true;
  },
  async savePrenda(id,data){ data=Object.assign({},data); delete data.id; if(!data.caja) data.caja=null;
    const r= id? await sb.from("prendas").update(data).eq("id",id) : await sb.from("prendas").insert(data); if(r.error) throw r.error; await store.reload() },
  async deletePrenda(id,foto){ const r=await sb.from("prendas").delete().eq("id",id); if(r.error) throw r.error; if(foto){ try{ await sb.storage.from("fotos").remove([foto]) }catch(e){} } await store.reload() },
  async saveCaja(codigo,data){ data=Object.assign({},data); delete data.id; if(!data.creado) delete data.creado; data.codigo=codigo; const r=await sb.from("cajas").upsert(data); if(r.error) throw r.error; await store.reload() },
  async deleteCaja(codigo){ const r=await sb.from("cajas").delete().eq("codigo",codigo); if(r.error) throw r.error; await store.reload() },
  async setFondo(id,blob){ const path="fondos/"+id+"-"+Date.now()+".jpg";
    const r=await sb.storage.from("fotos").upload(path,blob,{contentType:"image/jpeg"}); if(r.error) throw r.error;
    const old=(S.fondosAll||[]).filter(p=>p.startsWith("fondos/"+id+"-")); if(old.length) await sb.storage.from("fotos").remove(old);
    await store.reload() },
  async uploadFoto(blob){ const path=(crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random().toString(36).slice(2))+".jpg";
    const r=await sb.storage.from("fotos").upload(path,blob,{contentType:blob.type||"image/jpeg"}); if(r.error) throw r.error; return path }
};
function clean(r){const o={};for(const k in r){o[k]=r[k]==null?"":r[k]}return o}
const S = { prendas:new Map(), cajas:new Map(), loaded:{p:false,c:false}, q:"", tab:"secciones", ubiFilter:"", secFilter:"", homeSecs:[], fil:{sec:"",ubi:"",color:"",talla:"",marca:"",orden:"nombre"} };
try{const hs=JSON.parse(localStorage.getItem("homeSecs")||"[]"); if(Array.isArray(hs)) S.homeSecs=hs.filter(x=>SEC[x])}catch(e){}
const $ = s=>document.querySelector(s);
const esc = s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s=>String(s??"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
const imgSrc = p=>p?(urlCache.get(p)||""):"";
function toast(msg){const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}

// ====== Rutas (#seccion-x, #caja-c01, #cajas, #todo) ======
function route(){const h=decodeURIComponent(location.hash.slice(1));return h}
function go(h){ if(location.hash.slice(1)===h) render(); else location.hash=h; window.scrollTo(0,0) }
window.addEventListener("hashchange",()=>{render();window.scrollTo(0,0)});

// ====== Render ======
function prendasArr(){return [...S.prendas.values()].sort((a,b)=>norm(a.nombre).localeCompare(norm(b.nombre)))}
function cajasArr(){return [...S.cajas.values()].sort((a,b)=>a.codigo.localeCompare(b.codigo,undefined,{numeric:true}))}
function enCaja(cod){return prendasArr().filter(p=>p.ubicacion==="caja"&&p.caja===cod)}
function countSec(id){let n=0;S.prendas.forEach(p=>{if(p.seccion===id)n++});return n}

function itemHTML(p){
  const sec=SEC[p.seccion]; const bits=[sec?sec.n:"", p.color, p.talla?("Talla "+p.talla):"", p.marca].filter(Boolean).join(" · ");
  const where = p.ubicacion==="caja"&&p.caja ? `<span class="pill box">Caja ${esc(p.caja)}</span>` : `<span class="pill loc">${esc(UBI[p.ubicacion]||"Closet")}</span>`;
  const th = p.foto ? `<img src="${esc(imgSrc(p.foto))}" alt="" loading="lazy">` : esc((p.nombre||"?").trim().charAt(0).toUpperCase());
  return `<button class="item" type="button" data-edit="${esc(p.id)}"><div class="thumb" style="${sec?`color:${sec.c}`:""}">${th}</div><div class="txt"><div class="t">${esc(p.nombre)}${p.ejemplo?'<span class="example">EJEMPLO</span>':""}</div><div class="s">${esc(bits)}</div></div>${where}</button>`;
}
function cardHTML(p,hideBox){
  const sec=SEC[p.seccion]; const bits=[p.color, p.talla?("Talla "+p.talla):"", p.marca].filter(Boolean).join(" · ")||(sec?sec.n:"");
  let badge="";
  if(p.ubicacion==="caja"&&p.caja){ if(!hideBox) badge=`<div class="badge"><div class="boxtag"><small>CAJA</small><span>${esc(p.caja.replace(/^C/,""))}</span></div></div>` }
  else if(p.ubicacion&&p.ubicacion!=="closet") badge=`<div class="badge"><span class="pill loc">${esc(UBI[p.ubicacion]||"")}</span></div>`;
  const ph = p.foto ? `<img src="${esc(imgSrc(p.foto))}" alt="${esc(p.nombre)}" loading="lazy">` : `<span class="ini" style="color:${sec?sec.c:"var(--accent)"}">${esc((p.nombre||"?").trim().charAt(0).toUpperCase())}</span><span class="add">Toca para agregar foto</span>`;
  return `<div class="card" role="button" tabindex="0" data-edit="${esc(p.id)}" style="--sc:${sec?sec.c:"#3f7cc4"}">${badge}<button class="del" type="button" data-del="${esc(p.id)}" aria-label="Eliminar ${esc(p.nombre)}" title="Eliminar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button><div class="ph">${ph}<div class="bd"><div class="t">${esc(p.nombre)}</div>${bits?`<div class="s">${esc(bits)}</div>`:""}${p.notas?`<div class="nt">${esc(p.notas)}</div>`:""}</div></div></div>`;
}
function boxCardHTML(c){
  const n=enCaja(c.codigo).length;
  return `<button class="boxcard" type="button" data-go="caja-${esc(c.codigo.toLowerCase())}"><div class="boxtag"><small>CAJA</small><span>${esc(c.codigo.replace(/^C/,""))}</span></div><div class="txt" style="min-width:0;flex:1"><div class="t" style="font-weight:800">${esc(c.nombre||"Sin nombre")}${c.ejemplo?'<span class="example">EJEMPLO</span>':""}</div><div class="s" style="color:var(--muted);font-size:13px">${n} ${n===1?"prenda":"prendas"}${c.lugar?" · "+esc(c.lugar):""}</div></div></button>`;
}
function searchHits(){
  const q=norm(S.q).trim(); if(!q) return null;
  const words=q.split(/\s+/);
  return prendasArr().filter(p=>{
    const hay=norm([p.nombre,p.color,p.talla,p.marca,p.notas,SEC[p.seccion]?.n,UBI[p.ubicacion],p.caja?("caja "+p.caja+" "+p.caja.replace(/^C0*/,"")):""].join(" "));
    return words.every(w=>hay.includes(w));
  });
}

function render(){
  const app=$("#app"); const r=route();
  const loaded=S.loaded.p&&S.loaded.c;
  let body="";
  if(r==="etiquetas") body=viewEtiquetas();
  else if(r.startsWith("caja-")) body=viewCaja(r.slice(5).toUpperCase());
  else if(r.startsWith("seccion-")) body=viewSeccion(r.slice(8));
  else body=viewHome(r==="cajas"?"cajas":r==="todo"?"todo":"secciones");
  app.innerHTML=`<header class="brand"><h1>Guille’s <em>Closet</em></h1><span class="status" id="status">${loaded?"":"Cargando…"}</span></header>`+body;
  wire(app);
  drawQRs();
}

function viewHome(tab){
  const hits=searchHits();
  const tP=S.prendas.size, tC=S.cajas.size; let tEnCaja=0; S.prendas.forEach(p=>{if(p.ubicacion==="caja")tEnCaja++});
  let h=`<div class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" style="color:var(--muted)"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="q" type="search" placeholder="Buscar: sudadera, negra, caja 3…" value="${esc(S.q)}" autocomplete="off"></div>`;
  if(hits){
    h+=`<div class="group-title">${hits.length} resultado${hits.length===1?"":"s"}</div>`;
    h+= hits.length?`<div class="list">${hits.map(itemHTML).join("")}</div>`:`<div class="empty">No encontré nada con “${esc(S.q)}”.</div>`;
    return h;
  }
  h+=`<div class="tabs" role="tablist">${[["secciones","Secciones"],["cajas","Cajas"],["todo","Toda la ropa"]].map(([k,n])=>`<button class="tab" type="button" data-go="${k==="secciones"?"":k}" aria-current="${tab===k}">${n}</button>`).join("")}</div>`;
  h+=`<div class="stats"><span><b>${tP}</b>prendas</span><span><b>${tC}</b>cajas</span><span><b>${tEnCaja}</b>guardadas en caja</span></div>`;
  if(tab==="secciones"){
    const sel=S.homeSecs;
    h+=`<div class="secbar"><span class="secbar-l">Ver secciones:</span><div class="chips secchips"><button class="chip" type="button" data-hsec="" aria-pressed="${!sel.length}">Todas</button>${Object.values(SEC).map(x=>`<button class="chip" type="button" data-hsec="${x.id}" aria-pressed="${sel.includes(x.id)}"><span class="dot" style="background:${x.c}"></span>${esc(x.n)}</button>`).join("")}</div></div>`;
    const vis=Object.values(SEC).filter(x=>!sel.length||sel.includes(x.id));
    if(sel.length) h+=`<div class="note">Mostrando ${vis.length} de ${Object.keys(SEC).length} secciones · <button class="linkbtn" type="button" data-hsec="">ver todas</button></div>`;
    h+=`<div class="banners">`+vis.map(sec=>bannerHTML(sec,false)).join("")+`</div>`;
  } else if(tab==="cajas"){
    const cs=cajasArr();
    h+=`<div class="row"><button class="btn primary" type="button" data-newbox>+ Nueva caja</button>${cs.length?`<button class="btn" type="button" data-go="etiquetas">Imprimir etiquetas QR</button>`:""}<button class="btn" type="button" data-logout>Cerrar sesión</button></div>`;
    h+= cs.length?`<div class="list">${cs.map(boxCardHTML).join("")}</div>`:`<div class="empty">Aún no tienes cajas. Crea una, imprime su QR y pégalo en la caja.</div>`;
  } else {
    resetFil("todo"); const all=prendasArr();
    if(all.length) h+=filtrosHTML(all,true);
    const ps=aplicarFiltros(all);
    h+= ps.length?`<div class="cards">${ps.map(p=>cardHTML(p)).join("")}</div>`:(all.length?`<div class="empty">Ninguna prenda coincide con estos filtros.</div>`:`<div class="empty">Nada por aquí todavía.</div>`);
  }
  return h;
}

function viewEtiquetas(){
  const cs=cajasArr();
  let h=`<button class="back" type="button" data-go="cajas">← Cajas</button><div class="noprint"><h2>Etiquetas QR</h2><p class="note">Se imprimen 2 por fila. Recórtalas y pégalas en cada caja.</p><div class="row"><button class="btn primary" type="button" data-print>Imprimir</button></div></div>`;
  if(typeof qrcode!=="function") return h+`<div class="empty">El generador de QR no cargó. Recarga la página.</div>`;
  return h+`<div class="labels cards" style="margin-top:14px">${cs.map(c=>`<img alt="Etiqueta caja ${esc(c.codigo)}" src="${labelCanvas(c).toDataURL("image/png")}" style="width:100%;border-radius:8px;border:1px solid var(--line);background:#fff">`).join("")}</div>`;
}
function fondoURL(id){const p=(S.fondos||{})[id];return p?urlCache.get(p)||"":""}
function bannerHTML(sec,hero){
  const k=countSec(sec.id); let enc=0; S.prendas.forEach(p=>{if(p.seccion===sec.id&&p.ubicacion==="caja")enc++});
  const u=fondoURL(sec.id);
  const tag=hero?"div":"div";
  return `<div class="banner ${u?"":"noimg"} ${hero?"hero":""}" style="--sc:${sec.c}" ${hero?"":`role="link" tabindex="0" data-go="seccion-${sec.id}"`}>${u?`<img class="bg" src="${esc(u)}" alt="">`:""}
    <div class="in"><div class="nm">${esc(sec.n)}</div><div class="ct">${k} ${k===1?"prenda":"prendas"}${enc?` · ${enc} en cajas`:""}</div></div>
    <label class="ph-btn" data-fondo-lbl><input type="file" accept="image/*" data-fondo="${sec.id}" style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 7h3l2-2h6l2 2h3v12H4z"/><circle cx="12" cy="13" r="3.5"/></svg>${u?"Cambiar fondo":"Poner fondo"}</label>
    ${hero?"":`<span class="go">Ver →</span>`}</div>`;
}
async function subirFondo(id,f){
  if(!f) return; toast("Subiendo fondo…");
  try{ const b=await shrink(f,1800); await store.setFondo(id,b); toast("Fondo listo") }
  catch(e){ console.error(e); toastLong("No se pudo subir la imagen: "+((e&&(e.message||e.error))||"error desconocido")) }
}
function toastLong(msg){const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),7000)}
function filtrosHTML(ps,showSec){
  const F=S.fil; const uniq=k=>[...new Set(ps.map(p=>(p[k]||"").trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"es"));
  const sel=(k,label,opts)=>opts.length?`<label class="fsel"><span>${label}</span><select data-fil="${k}"><option value="">Todos</option>${opts.map(o=>`<option ${norm(F[k])===norm(o)?"selected":""}>${esc(o)}</option>`).join("")}</select></label>`:"";
  const activos=["sec","ubi","color","talla","marca"].filter(k=>F[k]).length;
  return `<div class="filtros">
    <div class="chips">${[["","Todas"],...UBICACIONES].map(([k,n])=>`<button class="chip" type="button" data-fil-ubi="${k}" aria-pressed="${F.ubi===k}">${esc(n)}</button>`).join("")}</div>
    <div class="frow">
      ${showSec?`<label class="fsel"><span>Sección</span><select data-fil="sec"><option value="">Todas</option>${Object.values(SEC).map(x=>`<option value="${x.id}" ${F.sec===x.id?"selected":""}>${esc(x.n)}</option>`).join("")}</select></label>`:""}
      ${sel("color","Color",uniq("color"))}${sel("talla","Talla",uniq("talla"))}${sel("marca","Marca",uniq("marca"))}
      <label class="fsel"><span>Ordenar</span><select data-fil="orden"><option value="nombre" ${F.orden==="nombre"?"selected":""}>Nombre A–Z</option><option value="nuevo" ${F.orden==="nuevo"?"selected":""}>Más nuevas</option><option value="color" ${F.orden==="color"?"selected":""}>Color</option></select></label>
      ${activos?`<button class="btn" type="button" data-fil-clear>Quitar filtros (${activos})</button>`:""}
    </div></div>`;
}
function aplicarFiltros(ps){
  const F=S.fil;
  let r=ps.filter(p=>(!F.sec||p.seccion===F.sec)&&(!F.ubi||p.ubicacion===F.ubi)&&(!F.color||norm(p.color)===norm(F.color))&&(!F.talla||norm(p.talla)===norm(F.talla))&&(!F.marca||norm(p.marca)===norm(F.marca)));
  if(F.orden==="nuevo") r=r.slice().sort((a,b)=>String(b.creado||"").localeCompare(String(a.creado||"")));
  else if(F.orden==="color") r=r.slice().sort((a,b)=>norm(a.color).localeCompare(norm(b.color))||norm(a.nombre).localeCompare(norm(b.nombre)));
  return r;
}
let filCtx="";
function resetFil(ctx){ if(filCtx!==ctx){ filCtx=ctx; S.fil={sec:"",ubi:"",color:"",talla:"",marca:"",orden:S.fil.orden||"nombre"} } }
function viewSeccion(id){
  const sec=SEC[id]; if(!sec) return `<button class="back" data-go="">← Inicio</button><div class="empty">Esa sección no existe.</div>`;
  const ps=prendasArr().filter(p=>p.seccion===id);
  const fuera=ps.filter(p=>p.ubicacion!=="caja"), dentro=ps.filter(p=>p.ubicacion==="caja");
  let h=`<button class="back" type="button" data-go="">← Secciones</button>`+bannerHTML(sec,true);
  h+=`<div class="row"><button class="btn primary" type="button" data-new-sec="${id}">+ Agregar a ${esc(sec.n)}</button></div>`;
  if(!ps.length) return h+`<div class="empty">Todavía no hay prendas en esta sección.</div>`;
  resetFil("sec-"+id);
  h+=filtrosHTML(ps,false);
  const fps=aplicarFiltros(ps);
  if(!fps.length) return h+`<div class="empty">Ninguna prenda coincide con estos filtros.</div>`;
  if(fps.length!==ps.length) h+=`<div class="note">Mostrando ${fps.length} de ${ps.length} prendas</div>`;
  return h+(()=>{let x="";const fuera=fps.filter(p=>p.ubicacion!=="caja"), dentro=fps.filter(p=>p.ubicacion==="caja");
  if(fuera.length) x+=`<div class="group-title">A la mano</div><div class="cards">${fuera.map(p=>cardHTML(p)).join("")}</div>`;
  if(dentro.length) x+=`<div class="group-title">Guardadas en cajas</div><div class="cards">${dentro.map(p=>cardHTML(p)).join("")}</div>`;
  return x})();
  if(fuera.length) h+=`<div class="group-title">A la mano</div><div class="cards">${fuera.map(p=>cardHTML(p)).join("")}</div>`;
  if(dentro.length) h+=`<div class="group-title">Guardadas en cajas</div><div class="cards">${dentro.map(p=>cardHTML(p)).join("")}</div>`;
  return h;
}

function viewCaja(cod){
  const c=S.cajas.get(cod.toLowerCase());
  if(!c){ return `<button class="back" type="button" data-go="cajas">← Cajas</button>`+(S.loaded.c?`<div class="empty">La caja ${esc(cod)} todavía no está registrada.<div class="row" style="justify-content:center"><button class="btn primary" type="button" data-createbox="${esc(cod)}">Registrar caja ${esc(cod)}</button></div></div>`:`<div class="empty">Abriendo la caja ${esc(cod)}…</div>`); }
  const ps=enCaja(c.codigo); const sec=SEC[c.seccion];
  let h=`<button class="back" type="button" data-go="cajas">← Cajas</button>`;
  h+=`<div class="head"><div class="boxtag" style="padding:10px 14px"><small>CAJA</small><span style="font-size:38px">${esc(c.codigo.replace(/^C/,""))}</span></div><div class="meta"><h2>${esc(c.nombre||"Sin nombre")}${c.ejemplo?'<span class="example">EJEMPLO</span>':""}</h2><p>${ps.length} ${ps.length===1?"prenda":"prendas"} adentro${c.lugar?" · Está en: "+esc(c.lugar):""}${sec?" · "+esc(sec.n):""}</p>${c.notas?`<p>${esc(c.notas)}</p>`:""}</div><div class="qrbox" data-qr="${esc(c.codigo)}" title="QR de esta caja"></div></div>`;
  h+=`<div class="row"><button class="btn primary" type="button" data-new-box="${esc(c.codigo)}">+ Meter prenda</button><button class="btn" type="button" data-label="${esc(c.codigo)}">Descargar etiqueta QR</button><button class="btn" type="button" data-editbox="${esc(c.codigo)}">Editar caja</button></div>`;
  h+= ps.length?`<div class="group-title">Contenido</div><div class="cards">${ps.map(p=>cardHTML(p,true)).join("")}</div>`:`<div class="empty">Esta caja está vacía. Toca “Meter prenda”.</div>`;
  return h;
}

function wire(root){
  root.querySelectorAll("[data-go]").forEach(b=>{b.onclick=()=>{S.q="";go(b.dataset.go)}; if(b.classList.contains("banner")) b.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();b.click()}}});
  root.querySelectorAll("[data-fondo-lbl]").forEach(l=>{l.onclick=e=>e.stopPropagation(); l.onkeydown=e=>e.stopPropagation()});
  root.querySelectorAll("input[data-fondo]").forEach(inp=>{inp.onclick=e=>e.stopPropagation(); inp.onchange=()=>subirFondo(inp.dataset.fondo,inp.files[0])});
  root.querySelectorAll("[data-edit]").forEach(b=>{b.onclick=()=>openViewer(b.dataset.edit); if(b.classList.contains("card")) b.onkeydown=e=>{if(e.target===b&&(e.key==="Enter"||e.key===" ")){e.preventDefault();b.click()}}});
  root.querySelectorAll("[data-del]").forEach(b=>b.onclick=e=>{e.stopPropagation();borrarPrenda(S.prendas.get(b.dataset.del))});
  root.querySelectorAll("[data-new-sec]").forEach(b=>b.onclick=()=>openPrenda(null,{seccion:b.dataset.newSec}));

// ====== QR ======
function cajaURL(cod){return APP_URL+"#caja-"+cod.toLowerCase()}
function qrMatrix(text){ if(typeof qrcode!=="function") return null; const q=qrcode(0,"M"); q.addData(text); q.make(); return q }
function drawQR(ctx,text,x,y,size){
  const q=qrMatrix(text); if(!q) return false; const n=q.getModuleCount(); const quiet=2; const cell=size/(n+quiet*2);
  ctx.fillStyle="#fff"; ctx.fillRect(x,y,size,size); ctx.fillStyle="#000";
  for(let r=0;r<n;r++)for(let c=0;c<n;c++) if(q.isDark(r,c)) ctx.fillRect(Math.floor(x+(c+quiet)*cell),Math.floor(y+(r+quiet)*cell),Math.ceil(cell),Math.ceil(cell));
  return true;
}
function drawQRs(){
  document.querySelectorAll("[data-qr]").forEach(el=>{
    const cv=document.createElement("canvas"); cv.width=cv.height=480;
    if(drawQR(cv.getContext("2d"),cajaURL(el.dataset.qr),0,0,480)){el.innerHTML="";el.appendChild(cv)}
    else el.innerHTML='<div class="note" style="color:#333">QR no disponible</div>';
  });
}
function labelCanvas(c){
  const W=900,H=1200, cv=document.createElement("canvas"); cv.width=W; cv.height=H; const x=cv.getContext("2d");
  x.fillStyle="#fff"; x.fillRect(0,0,W,H);
  x.strokeStyle="#16233a"; x.lineWidth=6; x.setLineDash([22,14]); x.strokeRect(20,20,W-40,H-40); x.setLineDash([]);
  x.fillStyle="#8a5a2b"; x.textAlign="center";
  x.font="800 44px Nunito, sans-serif"; x.fillText("C A J A",W/2,120);
  x.fillStyle="#16233a"; x.font="600 190px Fraunces, Georgia, serif"; x.fillText(c.codigo,W/2,300);
  x.font="700 46px Nunito, sans-serif"; x.fillText((c.nombre||"").slice(0,30),W/2,380);
  drawQR(x,cajaURL(c.codigo),170,420,560);
  x.fillStyle="#5d6b80"; x.font="600 32px Nunito, sans-serif";
  x.fillText("Escanea para ver qué hay adentro",W/2,1050);
  if(c.lugar) x.fillText("Va en: "+c.lugar.slice(0,34),W/2,1100);
  return cv;
}
async function saveLabel(c){
  if(!c) return;
  if(typeof qrcode!=="function"){toast("El generador de QR no cargó. Recarga la página.");return}
  const cv=labelCanvas(c);
  const blob=await new Promise(r=>cv.toBlob(r,"image/png"));
  const file=new File([blob],`etiqueta-caja-${c.codigo}.png`,{type:"image/png"});
  if(navigator.canShare&&navigator.canShare({files:[file]})){ try{ await navigator.share({files:[file],title:"Etiqueta caja "+c.codigo}); return }catch(e){ if(e&&e.name==="AbortError") return } }
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=file.name; document.body.appendChild(a); a.click(); a.remove(); toast("Etiqueta descargada")
}
function showLabel(cv,c){
  const url=cv.toDataURL("image/png");
  openSheet(`<h2>Etiqueta caja ${esc(c.codigo)}</h2><img src="${url}" alt="Etiqueta QR" style="width:100%;border-radius:12px;border:1px solid var(--line)"><p class="note">Mantén presionada la imagen para guardarla y luego imprímela.</p><div class="row"><button class="btn" type="button" data-close>Cerrar</button></div>`);
}

// ====== Hojas (formularios) ======
function openSheet(html){
  const L=$("#layer"); L.innerHTML=`<div class="sheet-bg"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  const bg=L.firstChild; bg.onclick=e=>{if(e.target===bg)closeSheet()};
  L.querySelectorAll("[data-close]").forEach(b=>b.onclick=closeSheet);
  return L.querySelector(".sheet");
}
function closeSheet(){$("#layer").innerHTML="";document.removeEventListener("keydown",viewerKeys)}
let viewerIds=[], viewerIdx=0;
function viewerKeys(e){ if(e.key==="Escape") closeSheet(); else if(e.key==="ArrowRight") moveViewer(1); else if(e.key==="ArrowLeft") moveViewer(-1) }
function moveViewer(d){ if(viewerIds.length<2) return; viewerIdx=(viewerIdx+d+viewerIds.length)%viewerIds.length; showViewer() }
function openViewer(id){
  viewerIds=[...new Set([...document.querySelectorAll("#app [data-edit]")].map(x=>x.dataset.edit))];
  viewerIdx=Math.max(0,viewerIds.indexOf(id)); showViewer();
  document.removeEventListener("keydown",viewerKeys); document.addEventListener("keydown",viewerKeys);
}
function showViewer(){
  const p=S.prendas.get(viewerIds[viewerIdx]); if(!p){closeSheet();return}
  const sec=SEC[p.seccion];
  const det=[["Sección",sec?sec.n:""],["Color",p.color],["Talla",p.talla],["Marca",p.marca],["Dónde está",p.ubicacion==="caja"&&p.caja?("Caja "+p.caja.replace(/^C0?/,"")):(UBI[p.ubicacion]||"")]].filter(x=>x[1]);
  const img=p.foto&&imgSrc(p.foto)?`<img src="${esc(imgSrc(p.foto))}" alt="${esc(p.nombre)}">`:`<div class="vw-noimg" style="--sc:${sec?sec.c:"#3f7cc4"}"><span>${esc((p.nombre||"?").trim().charAt(0).toUpperCase())}</span><small>Sin foto todavía</small></div>`;
  const L=$("#layer");
  L.innerHTML=`<div class="vw" role="dialog" aria-modal="true" aria-label="${esc(p.nombre)}">
    <button class="vw-x" type="button" data-vw-close aria-label="Cerrar">✕</button>
    ${viewerIds.length>1?`<button class="vw-nav l" type="button" data-vw="-1" aria-label="Anterior">‹</button><button class="vw-nav r" type="button" data-vw="1" aria-label="Siguiente">›</button>`:""}
    <div class="vw-img">${img}</div>
    <div class="vw-info">
      <div class="vw-t">${esc(p.nombre)}</div>
      ${det.length?`<div class="vw-det">${det.map(([k,v])=>`<span><b>${esc(k)}:</b> ${esc(v)}</span>`).join("")}</div>`:""}
      ${p.notas?`<div class="vw-notas">${esc(p.notas)}</div>`:""}
      <div class="row"><button class="btn primary" type="button" data-vw-edit>${p.foto?"Editar":"Editar / agregar foto"}</button><button class="btn danger" type="button" data-vw-del>Eliminar</button>${viewerIds.length>1?`<span class="vw-n">${viewerIdx+1} de ${viewerIds.length}</span>`:""}</div>
    </div></div>`;
  const vw=L.firstChild;
  vw.onclick=e=>{ if(e.target===vw||e.target.classList.contains("vw-img")) closeSheet() };
  L.querySelector("[data-vw-close]").onclick=closeSheet;
  L.querySelectorAll("[data-vw]").forEach(b=>b.onclick=e=>{e.stopPropagation();moveViewer(+b.dataset.vw)});
  L.querySelector("[data-vw-edit]").onclick=()=>{document.removeEventListener("keydown",viewerKeys);openPrenda(p)};
  L.querySelector("[data-vw-del]").onclick=()=>{document.removeEventListener("keydown",viewerKeys);borrarPrenda(p)};
  let x0=null; vw.ontouchstart=e=>{x0=e.touches[0].clientX}; vw.ontouchend=e=>{ if(x0==null) return; const dx=e.changedTouches[0].clientX-x0; if(Math.abs(dx)>50) moveViewer(dx<0?1:-1); x0=null };
}
function confirmar2(que,detalle,fn){
  const el=openSheet(`<div class="confirm"><h2>¿Eliminar ${esc(que)}?</h2><p class="big">${esc(detalle)}</p><div class="row"><button class="btn danger" type="button" id="k1">Sí, eliminar</button><button class="btn" type="button" data-close>Cancelar</button></div></div>`);
  el.querySelector("#k1").onclick=()=>{
    const el2=openSheet(`<div class="confirm"><h2>¿Estás seguro?</h2><p class="big">Vas a eliminar ${esc(que)} para siempre. Esto no se puede deshacer.</p><div class="row"><button class="btn solid-danger" type="button" id="k2">Eliminar definitivamente</button><button class="btn" type="button" data-close>No, cancelar</button></div></div>`);
    el2.querySelector("#k2").onclick=async()=>{ const b=el2.querySelector("#k2"); b.disabled=true; b.textContent="Eliminando…"; await fn() };
  };
}
function borrarPrenda(p){
  if(!p) return;
  confirmar2("“"+p.nombre+"”","Se borrará esta prenda"+(p.foto?" y su foto":"")+".",async()=>{
    try{ await store.deletePrenda(p.id,p.foto); closeSheet(); toast("Prenda eliminada") }catch(e){ closeSheet(); toastLong("No se pudo eliminar: "+((e&&e.message)||"intenta de nuevo")) }
  });
}
function armDelete(btn,fn,que,detalle){btn.onclick=()=>confirmar2(que,detalle,fn)}

function secOptions(sel,vacio){return `<option value="">${vacio||"— Elige sección —"}</option>`+Object.values(SEC).map(x=>`<option value="${x.id}" ${sel===x.id?"selected":""}>${esc(x.n)}</option>`).join("")}

function openPrenda(p,preset={}){
  const isNew=!p; const v=Object.assign({nombre:"",seccion:"",color:"",talla:"",marca:"",ubicacion:"closet",caja:"",notas:"",foto:""},preset,p||{});
  const cs=cajasArr();
  const el=openSheet(`<h2>${isNew?"Agregar prenda":"Editar prenda"}</h2>
  <form id="fp" autocomplete="off">
    <div class="f"><label for="p-nombre">QUÉ ES</label><input id="p-nombre" required placeholder="Ej. Sudadera gris Nike" value="${esc(v.nombre)}"></div>
    <div class="f"><label for="p-sec">SECCIÓN (OPCIONAL)</label><select id="p-sec">${secOptions(v.seccion,"— Sin sección —")}</select></div>
    <div class="two">
      <div class="f"><label for="p-color">COLOR</label><input id="p-color" placeholder="Ej. negro" value="${esc(v.color)}"></div>
      <div class="f"><label for="p-talla">TALLA</label><input id="p-talla" placeholder="Ej. M, 32" value="${esc(v.talla)}"></div>
    </div>
    <div class="f"><label for="p-marca">MARCA</label><input id="p-marca" value="${esc(v.marca)}"></div>
    <div class="two">
      <div class="f"><label for="p-ubi">DÓNDE ESTÁ</label><select id="p-ubi">${UBICACIONES.map(([k,n])=>`<option value="${k}" ${v.ubicacion===k?"selected":""}>${esc(n)}</option>`).join("")}</select></div>
      <div class="f" id="p-caja-wrap"><label for="p-caja">CAJA</label><select id="p-caja">${cs.length?cs.map(c=>`<option value="${esc(c.codigo)}" ${v.caja===c.codigo?"selected":""}>Caja ${esc(c.codigo)} · ${esc(c.nombre||"")}</option>`).join(""):`<option value="">Primero crea una caja</option>`}</select></div>
    </div>
    <div class="f"><label for="p-notas">NOTAS</label><textarea id="p-notas" rows="2" placeholder="Ej. le falta un botón, es de mi hermano…">${esc(v.notas)}</textarea></div>
    <div class="f"><label for="p-foto">FOTO (OPCIONAL)</label><div style="display:flex;gap:10px;align-items:center"><img id="p-prev" class="photo-prev" alt="" ${v.foto?`src="${esc(imgSrc(v.foto))}"`:"hidden"}><input id="p-foto" type="file" accept="image/*"></div><div class="note" id="p-foto-note" ${assets?"hidden":""}>Las fotos no están disponibles en esta vista.</div></div>
    <div class="row"><button class="btn primary" type="submit" id="p-save">${isNew?"Guardar prenda":"Guardar cambios"}</button><button class="btn" type="button" data-close>Cancelar</button>${isNew?"":`<button class="btn danger" type="button" id="p-del">Eliminar</button>`}</div>
  </form>`);
  const ubi=el.querySelector("#p-ubi"), cw=el.querySelector("#p-caja-wrap");
  const sync=()=>cw.hidden=ubi.value!=="caja"; ubi.onchange=sync; sync();
  let newFile=null;
  const fi=el.querySelector("#p-foto"); fi.disabled=!assets;
  fi.onchange=()=>{newFile=fi.files[0]||null; const pv=el.querySelector("#p-prev"); if(newFile){pv.src=URL.createObjectURL(newFile);pv.hidden=false}};
  if(!isNew) el.querySelector("#p-del").onclick=()=>borrarPrenda(p);
  el.querySelector("#fp").onsubmit=async e=>{
    e.preventDefault(); const btn=el.querySelector("#p-save"); btn.disabled=true; btn.textContent="Guardando…";
    const data={
      nombre:el.querySelector("#p-nombre").value.trim(), seccion:el.querySelector("#p-sec").value,
      color:el.querySelector("#p-color").value.trim(), talla:el.querySelector("#p-talla").value.trim(), marca:el.querySelector("#p-marca").value.trim(),
      ubicacion:ubi.value, caja:ubi.value==="caja"?el.querySelector("#p-caja").value:"", notas:el.querySelector("#p-notas").value.trim(),
      foto:v.foto||"", actualizado:new Date().toISOString()
    };
    if(data.ubicacion==="caja"&&!data.caja){toast("Crea una caja primero (pestaña Cajas).");btn.disabled=false;btn.textContent="Guardar";return}
    try{
      if(newFile){ const small=await shrink(newFile); data.foto=await store.uploadFoto(small) }

      closeSheet(); toast(isNew?"Prenda guardada":"Cambios guardados");
    }catch(err){ btn.disabled=false; btn.textContent="Guardar"; console.error(err); toastLong("No se pudo guardar: "+((err&&(err.message||err.error))||"revisa tu conexión")) }
  };
}
function stripId(o){const c=Object.assign({},o);delete c.id;return c}
async function shrink(file,maxSide){
  try{ const bmp=await createImageBitmap(file); const m=maxSide||900, k=Math.min(1,m/Math.max(bmp.width,bmp.height));
    const cv=document.createElement("canvas"); cv.width=Math.round(bmp.width*k); cv.height=Math.round(bmp.height*k);
    cv.getContext("2d").drawImage(bmp,0,0,cv.width,cv.height); return await new Promise(r=>cv.toBlob(b=>r(b||file),"image/jpeg",.82)) }
  catch(e){ return file }
}
function nextCode(){let max=0;S.cajas.forEach(c=>{const n=parseInt(c.codigo.replace(/\D/g,""),10);if(n>max)max=n});return "C"+String(max+1).padStart(2,"0")}
function openCaja(c,codigo){
  const isNew=!c; const v=Object.assign({codigo:(codigo&&/^C\d{1,3}$/.test(codigo))?codigo:nextCode(),nombre:"",lugar:"",seccion:"",notas:""},c||{});
  const n=c?enCaja(c.codigo).length:0;
  const el=openSheet(`<h2>${isNew?"Nueva caja":"Editar caja "+esc(v.codigo)}</h2>
  <form id="fc" autocomplete="off">
    ${isNew?`<p class="note" style="margin-top:-6px">Se llamará <b>Caja ${esc(v.codigo)}</b>. Escribe ese número en la caja o pega su etiqueta QR.</p>`:""}
    <div class="f"><label for="c-nombre">QUÉ GUARDA</label><input id="c-nombre" required placeholder="Ej. Ropa de invierno" value="${esc(v.nombre)}"></div>
    <div class="f"><label for="c-lugar">DÓNDE ESTÁ LA CAJA</label><input id="c-lugar" placeholder="Ej. Arriba del closet, bajo la cama" value="${esc(v.lugar)}"></div>
    <div class="f"><label for="c-sec">SECCIÓN PRINCIPAL (OPCIONAL)</label><select id="c-sec">${secOptions(v.seccion)}</select></div>
    <div class="f"><label for="c-notas">NOTAS</label><textarea id="c-notas" rows="2">${esc(v.notas)}</textarea></div>
    <div class="row"><button class="btn primary" type="submit" id="c-save">${isNew?"Crear caja":"Guardar"}</button><button class="btn" type="button" data-close>Cancelar</button>${isNew?"":`<button class="btn danger" type="button" id="c-del" data-label="Borrar caja">Borrar caja</button>`}</div>
    ${!isNew&&n?`<p class="note">Si borras la caja, sus ${n} prendas pasan a “Closet”.</p>`:""}
  </form>`);
  if(!isNew) armDelete(el.querySelector("#c-del"),async()=>{
    try{ for(const p of enCaja(c.codigo)){ await store.savePrenda(p.id,{ubicacion:"closet",caja:null}) }
      await store.deleteCaja(c.codigo); closeSheet(); toast("Caja borrada"); go("cajas") }
    catch(e){ closeSheet(); toastLong("No se pudo eliminar: "+((e&&e.message)||"intenta de nuevo")) }
  },"la caja "+c.codigo,n?("Sus "+n+" prendas no se borran: pasan a “Closet”."):"La caja está vacía.");
  el.querySelector("#fc").onsubmit=async e=>{
    e.preventDefault(); const btn=el.querySelector("#c-save"); btn.disabled=true;
    const data=Object.assign({},isNew?{}:stripId(c),{codigo:v.codigo,nombre:el.querySelector("#c-nombre").value.trim(),lugar:el.querySelector("#c-lugar").value.trim(),seccion:el.querySelector("#c-sec").value,notas:el.querySelector("#c-notas").value.trim()});
    try{ await store.saveCaja(v.codigo,data); closeSheet(); toast(isNew?"Caja "+v.codigo+" creada":"Caja guardada"); go("caja-"+v.codigo.toLowerCase()) }
    catch(err){ btn.disabled=false; toast("No se pudo guardar. Intenta otra vez.") }
  };
}

$("#fab").onclick=()=>{
  const r=route();

};

// ====== Arranque ======
(async function start(){
  render();
  if(!window.supabase||!window.MI_CLOSET||!/^https:/.test(window.MI_CLOSET.supabaseUrl||"")){ $("#app").innerHTML='<header class="brand"><h1>Guille’s <em>Closet</em></h1></header><div class="empty">Falta configurar la conexión a Supabase en config.js.</div>'; $("#fab").hidden=true; return }
  sb=window.supabase.createClient(window.MI_CLOSET.supabaseUrl, window.MI_CLOSET.supabaseKey, {auth:{persistSession:true,autoRefreshToken:true}});
  const {data:{session}}=await sb.auth.getSession();
  if(!session) return showLogin();
  boot();
})();
async function boot(){
  $("#fab").hidden=false;
  try{ await store.reload() }catch(e){ const s=$("#status"); if(s) s.textContent="No se pudieron cargar los datos"; console.error(e) }
  // Primera vez: crear Caja 1 a Caja 10 (las de las etiquetas QR impresas)
  try{ if(S.loaded.c && S.cajas.size===0){
    const rows=[]; for(let i=1;i<=10;i++) rows.push({codigo:"C"+String(i).padStart(2,"0"),nombre:"Caja "+i,lugar:"",seccion:"",notas:""});
    const r=await sb.from("cajas").upsert(rows,{onConflict:"codigo",ignoreDuplicates:true}); if(!r.error) await store.reload();
  } }catch(e){ console.error(e) }
  document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") store.reload().catch(()=>{}) });
}
function showLogin(){
  $("#fab").hidden=true;
  $("#app").innerHTML=`<header class="brand"><h1>Guille’s <em>Closet</em></h1></header><form class="login" id="fl"><p style="color:var(--muted)">Entra con tu correo y contraseña para ver tu ropa.</p><div class="f"><label for="l-email">CORREO</label><input id="l-email" type="email" autocomplete="username" required></div><div class="f"><label for="l-pass">CONTRASEÑA</label><input id="l-pass" type="password" autocomplete="current-password" required></div><button class="btn primary" type="submit" style="width:100%">Entrar</button><div class="err" id="l-err" hidden></div></form>`;
  $("#fl").onsubmit=async e=>{ e.preventDefault(); const er=$("#l-err"); er.hidden=true;
    const {error}=await sb.auth.signInWithPassword({email:$("#l-email").value.trim(),password:$("#l-pass").value});
    if(error){ er.textContent="Correo o contraseña incorrectos."; er.hidden=false; return }
    render(); boot(); };
}
